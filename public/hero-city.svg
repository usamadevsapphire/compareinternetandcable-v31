<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1440" height="400" fill="url(#sky)"/>
  
  <!-- Far background buildings - very light -->
  <rect x="0" y="200" width="80" height="200" rx="4" fill="#dde8f5" opacity="0.6"/>
  <rect x="85" y="160" width="60" height="240" rx="4" fill="#d5e3f0" opacity="0.6"/>
  <rect x="150" y="180" width="70" height="220" rx="4" fill="#dde8f5" opacity="0.6"/>
  <rect x="225" y="140" width="55" height="260" rx="4" fill="#cfd9ec" opacity="0.7"/>
  <rect x="285" y="170" width="80" height="230" rx="4" fill="#d5e3f0" opacity="0.6"/>
  
  <rect x="1080" y="150" width="65" height="250" rx="4" fill="#cfd9ec" opacity="0.7"/>
  <rect x="1150" y="180" width="75" height="220" rx="4" fill="#d5e3f0" opacity="0.6"/>
  <rect x="1230" y="155" width="55" height="245" rx="4" fill="#dde8f5" opacity="0.6"/>
  <rect x="1290" y="175" width="80" height="225" rx="4" fill="#d5e3f0" opacity="0.6"/>
  <rect x="1375" y="160" width="65" height="240" rx="4" fill="#cfd9ec" opacity="0.7"/>

  <!-- Mid buildings left - teal/blue tinted -->
  <rect x="30" y="230" width="55" height="170" rx="3" fill="#b8d4e8" opacity="0.8"/>
  <rect x="90" y="210" width="45" height="190" rx="3" fill="#a8c8e0" opacity="0.8"/>
  <rect x="140" y="220" width="60" height="180" rx="3" fill="#b0cce4" opacity="0.8"/>
  
  <!-- Solar panel on building -->
  <rect x="35" y="228" width="45" height="8" fill="#a0bcd4" opacity="0.9"/>
  <line x1="57" y1="228" x2="57" y2="236" stroke="#8aacc4" stroke-width="1"/>
  
  <!-- WiFi tower left -->
  <rect x="200" y="190" width="8" height="180" fill="#c4d8ea"/>
  <path d="M185 210 Q204 200 223 210" stroke="#a8c8de" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M191 222 Q204 214 217 222" stroke="#a8c8de" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="204" cy="226" r="3" fill="#7c3aed" opacity="0.7"/>
  
  <!-- Mid buildings right -->
  <rect x="1200" y="220" width="55" height="180" rx="3" fill="#b8d4e8" opacity="0.8"/>
  <rect x="1260" y="215" width="50" height="185" rx="3" fill="#a8c8e0" opacity="0.8"/>
  <rect x="1315" y="225" width="60" height="175" rx="3" fill="#b0cce4" opacity="0.8"/>
  <rect x="1380" y="210" width="60" height="190" rx="3" fill="#a8c8e0" opacity="0.8"/>
  
  <!-- WiFi tower right -->
  <rect x="1230" y="188" width="8" height="192" fill="#c4d8ea"/>
  <path d="M1215 208 Q1234 198 1253 208" stroke="#a8c8de" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M1221 220 Q1234 212 1247 220" stroke="#a8c8de" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="1234" cy="224" r="3" fill="#06b6d4" opacity="0.7"/>

  <!-- Ground / road -->
  <rect x="0" y="368" width="1440" height="32" fill="#d0e0ec" opacity="0.7"/>
  <rect x="0" y="370" width="1440" height="28" fill="#c8dcea" opacity="0.6"/>
  
  <!-- Road markings -->
  <rect x="680" y="374" width="80" height="4" rx="2" fill="white" opacity="0.6"/>
  
  <!-- Trees left -->
  <rect x="340" y="340" width="10" height="30" fill="#a8c4d4"/>
  <ellipse cx="345" cy="332" rx="18" ry="16" fill="#6dc4a0" opacity="0.8"/>
  <rect x="380" y="345" width="8" height="25" fill="#a8c4d4"/>
  <ellipse cx="384" cy="339" rx="14" ry="12" fill="#7ccfaa" opacity="0.8"/>
  
  <!-- Trees right -->
  <rect x="1060" y="342" width="10" height="28" fill="#a8c4d4"/>
  <ellipse cx="1065" cy="334" rx="18" ry="16" fill="#6dc4a0" opacity="0.8"/>
  <rect x="1095" y="346" width="8" height="24" fill="#a8c4d4"/>
  <ellipse cx="1099" cy="340" rx="14" ry="12" fill="#7ccfaa" opacity="0.8"/>
  
  <!-- Person cycling left -->
  <g transform="translate(420, 330)" opacity="0.8">
    <!-- bike wheels -->
    <circle cx="8" cy="20" r="12" fill="none" stroke="#7c9cb8" stroke-width="2"/>
    <circle cx="38" cy="20" r="12" fill="none" stroke="#7c9cb8" stroke-width="2"/>
    <!-- bike frame -->
    <path d="M8 20 L23 8 L38 20 M23 8 L23 20 M8 20 L23 20" stroke="#7c9cb8" stroke-width="2" fill="none"/>
    <!-- rider -->
    <circle cx="26" cy="0" r="6" fill="#6b8faa"/>
    <path d="M26 6 L23 18" stroke="#6b8faa" stroke-width="2"/>
    <path d="M22 11 L30 14" stroke="#6b8faa" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- People sitting right -->
  <g transform="translate(1000, 325)" opacity="0.8">
    <!-- bench -->
    <rect x="0" y="28" width="50" height="4" rx="2" fill="#a8c4d4"/>
    <rect x="5" y="32" width="4" height="12" fill="#a8c4d4"/>
    <rect x="41" y="32" width="4" height="12" fill="#a8c4d4"/>
    <!-- person 1 -->
    <circle cx="12" cy="18" r="6" fill="#6b8faa"/>
    <rect x="8" y="24" width="10" height="10" rx="2" fill="#8aacbf"/>
    <!-- person 2 -->
    <circle cx="32" cy="14" r="6" fill="#6b8faa"/>
    <rect x="28" y="20" width="10" height="14" rx="2" fill="#7c9cb8"/>
    <!-- wifi signal from phone -->
    <path d="M38 8 Q41 5 44 8" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M36 5 Q41 1 46 5" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Smart home icons floating left top -->
  <g transform="translate(480,70)" opacity="0.3">
    <rect x="0" y="8" width="28" height="22" rx="2" fill="#94b8d0"/>
    <path d="M-3 10 L14 0 L31 10" fill="#7c9cb8"/>
    <!-- wifi signal on house -->
    <path d="M10 17 Q14 14 18 17" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M8 14 Q14 10 20 14" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="14" cy="19" r="1.5" fill="#7c3aed"/>
  </g>
  
  <!-- Connection lines floating -->
  <g opacity="0.1">
    <path d="M700 50 Q720 30 740 50 Q760 70 780 50" stroke="#7c3aed" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
  </g>
</svg>
